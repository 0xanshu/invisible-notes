<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#22252d"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#ffd764"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8bf4f"/>
      <stop offset="1" stop-color="#d9ae3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Sticky note with folded corner -->
  <g filter="url(#shadow)">
    <path d="M244 268
             H720
             a36 36 0 0 1 36 36
             V612
             L612 756
             H280
             a36 36 0 0 1 -36 -36
             V304
             a36 36 0 0 1 36 -36 Z" fill="url(#note)"/>
    <!-- Folded corner -->
    <path d="M756 612 L612 756 V648 a36 36 0 0 1 36 -36 Z" fill="url(#fold)"/>
  </g>

  <!-- Note lines -->
  <g stroke="#00000022" stroke-width="20" stroke-linecap="round">
    <line x1="312" y1="376" x2="688" y2="376"/>
    <line x1="312" y1="452" x2="688" y2="452"/>
    <line x1="312" y1="528" x2="560" y2="528"/>
  </g>

  <!-- Invisibility hint: dashed "hidden from capture" ring around an eye -->
  <g transform="translate(724,724)">
    <circle r="150" fill="#22252d"/>
    <circle r="150" fill="none" stroke="#ffd764" stroke-width="16" stroke-dasharray="30 26"/>
    <!-- eye -->
    <path d="M-84 0 Q0 -70 84 0 Q0 70 -84 0 Z" fill="#ffe9a3"/>
    <circle r="34" fill="#22252d"/>
    <!-- slash: hidden -->
    <line x1="-96" y1="-96" x2="96" y2="96" stroke="#ff6b6b" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
